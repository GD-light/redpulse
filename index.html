<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Red</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background-color: #000000; /* Start i svart */
      transition: background-color 1.25s ease-in-out; /* Fade-tid används av JS när färgen ändras */
    }
  </style>
</head>
<body>
  <script>
    // Sekvens i millisekunder
    const steps = [
      { duration: 250, color: '#000000' }, // Svart i 1200 ms
      { duration: 250, color: '#FF0000' },  // Fade till röd över 250 ms
      { duration: 2000, color: '#FF0000' }, // Visar röd i 2000 ms
      { duration: 1250, color: '#000000' }  // Fade till svart över 500 ms
    ];

    const root = document.body;
    const sleep = (ms) => new Promise(res => setTimeout(res, ms));

    async function runSequence() {
      // Starta i svart direkt
      root.style.backgroundColor = '#000000';
      // Vänta första svartperiod
      await sleep(1200);

      // Sätt en tydlig transition och gör fade till röd
      root.style.transition = 'background-color 1.25s ease-in-out';
      root.style.backgroundColor = '#FF0000';
      // Vänta fade-tiden och visning av röd
      await sleep(250); // färgändringen färdig

      // Visar röd i 2000 ms
      await sleep(2000);

      // Fade tillbaka till svart
      root.style.backgroundColor = '#000000';
      await sleep(250);

      // Upprepa
      runSequence();
    }

    // Initiera sekvensen när sidan är laddad
    window.addEventListener('load', () => {
      // Starta utan att vänta på extra resurser
      runSequence().catch(console.error);
    });
  </script>
</body>

</html>
